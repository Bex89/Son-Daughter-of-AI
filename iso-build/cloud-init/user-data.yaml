#cloud-config
# Nova Cloud-Init Configuration for Proxmox
# This can be used to deploy Nova on any cloud-init enabled VM

# System settings
hostname: nova-server
manage_etc_hosts: true
timezone: UTC

# Users
users:
  - name: nova-admin
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - # Add your SSH public key here

# Package updates and installation
package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - nginx
  - ufw
  - fail2ban
  - curl
  - wget

# Write files
write_files:
  # Nova systemd service
  - path: /etc/systemd/system/nova.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Nova - Autonomous AI Entity
      After=network.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=nova
      Group=nova
      WorkingDirectory=/opt/nova
      Environment="PATH=/opt/nova/venv/bin:/usr/local/bin:/usr/bin:/bin"
      EnvironmentFile=/opt/nova/.env
      ExecStart=/opt/nova/venv/bin/python /opt/nova/nova_server.py
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=nova

      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/opt/nova
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true

      [Install]
      WantedBy=multi-user.target

  # Nginx configuration
  - path: /etc/nginx/sites-available/nova
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          location / {
              proxy_pass http://127.0.0.1:5000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

  # Environment template
  - path: /tmp/nova.env
    permissions: '0600'
    content: |
      ANTHROPIC_API_KEY=your_api_key_here
      HOST=0.0.0.0
      PORT=5000

  # Installation script
  - path: /tmp/install-nova.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      echo "Installing Nova..."

      # Create nova user
      useradd -r -m -d /opt/nova -s /bin/bash nova || true

      # Create directory structure
      mkdir -p /opt/nova
      cd /opt/nova

      # Download Nova files from GitHub
      REPO_URL="https://raw.githubusercontent.com/Bex89/Son-Daughter-of-AI/claude/ai-assistant-child-aF9BR"
      curl -sL "$REPO_URL/nova.py" -o nova.py
      curl -sL "$REPO_URL/nova_server.py" -o nova_server.py
      curl -sL "$REPO_URL/index.html" -o index.html
      curl -sL "$REPO_URL/requirements.txt" -o requirements.txt

      # Set up environment
      cp /tmp/nova.env /opt/nova/.env

      # Create virtual environment
      python3 -m venv /opt/nova/venv
      /opt/nova/venv/bin/pip install --upgrade pip
      /opt/nova/venv/bin/pip install -r requirements.txt

      # Set permissions
      chown -R nova:nova /opt/nova
      chmod 750 /opt/nova
      chmod 640 /opt/nova/.env

      # Configure nginx
      rm -f /etc/nginx/sites-enabled/default
      ln -sf /etc/nginx/sites-available/nova /etc/nginx/sites-enabled/
      nginx -t && systemctl restart nginx

      # Configure firewall
      ufw --force enable
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw allow 80/tcp
      ufw allow 443/tcp

      # Enable service
      systemctl daemon-reload
      systemctl enable nova

      echo "Nova installation complete!"
      echo "Edit /opt/nova/.env to add your API key"
      echo "Then run: systemctl start nova"

# Run commands
runcmd:
  # Install Nova
  - bash /tmp/install-nova.sh

  # Display access information
  - echo "Nova has been installed!"
  - echo "Configure API key: sudo nano /opt/nova/.env"
  - echo "Start Nova: sudo systemctl start nova"
  - echo "Check status: sudo systemctl status nova"

# Final message
final_message: |
  ╔═══════════════════════════════════════════════════════════╗
  ║                                                           ║
  ║           NOVA SERVER READY                               ║
  ║                                                           ║
  ║  Next steps:                                             ║
  ║  1. Edit /opt/nova/.env and add ANTHROPIC_API_KEY        ║
  ║  2. Run: sudo systemctl start nova                       ║
  ║  3. Access: http://YOUR_IP                               ║
  ║                                                           ║
  ╚═══════════════════════════════════════════════════════════╝
